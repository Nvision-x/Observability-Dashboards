name: Dashboards check

# Re-runs tools/build-detail.py and fails when a committed generated board
# (Connectors Detail, Services Detail, Infrastructure Overview, Content
# Service (Legacy), the V2 section of Applications Overview) differs from
# what its per-cluster source boards produce, or when any board breaks a
# shared rule (invalid JSON, duplicate uid or panel id, overlapping panels,
# label=".*" matchers, undefined variables, the datasource variable, the
# 1 MiB ConfigMap limit, ConfigMap-safe file names).

on:
  pull_request:
    paths:
      - "dashboards/**"
      - "tools/**"
      - ".github/workflows/dashboards-check.yml"
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild generated boards and validate
        run: python3 tools/build-detail.py --check

      - name: How to fix
        if: failure()
        run: |
          echo "::error::Run 'python3 tools/build-detail.py' locally and commit the regenerated boards."
          echo "::error::Never edit connectors-detail.json, services-detail.json, infrastructure-overview.json,"
          echo "::error::content-service-legacy.json or the V2 section of applications-overview-central.json by hand."
          echo "::error::'python3 tools/build-detail.py --fix-sources' applies the shared rules to source boards."
